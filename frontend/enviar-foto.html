<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sua foto no Senac Salto</title><link rel="stylesheet" href="totem.css"><style>body{max-width:34rem;margin:auto;padding:1.3rem;background:white;min-height:100dvh}main{padding:1rem 0}img.marca{width:5rem}#prev{width:100%;max-height:34vh;object-fit:contain}form{display:grid;gap:1rem}label.aceite{display:flex;align-items:flex-start;gap:.5rem;font-weight:400}label.aceite input{width:1.2rem;min-height:1.2rem;margin:.15rem 0}#retorno{margin-top:1rem}h1{font-size:2.2rem}</style><script src="totem-base.js" defer></script><script src="enviar-foto.js" defer></script></head><body><img class="marca" src="senac-logo.png" alt="Senac"><main><h1>Sua foto no Senac Salto</h1><p>Compartilhe um momento de aula, projeto ou evento no Senac Salto. Escolha uma foto que respeite as pessoas retratadas e seja adequada ao ambiente escolar.</p><form><label>Escolha uma foto<input type="file" name="imagem" accept="image/jpeg,image/png,image/webp" required></label><img id="prev" hidden alt="Prévia da foto selecionada"><label class="aceite"><input type="checkbox" name="aceite" required>Estou ciente de que minha foto só será exibida no totem se a equipe do Senac Salto a aprovar. Autorizo a exibição e tenho permissão das pessoas que aparecem na foto.</label><button type="submit">Enviar para avaliação</button></form><p id="retorno" role="status"></p></main></body></html>
