<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salas de hoje · Senac Salto</title><link rel="stylesheet" href="totem-grade.css"><script defer src="totem-base.js"></script><script defer src="totem-qr.js"></script><script defer src="totem.js"></script></head><body><main>
<header><div class="marca"><img src="senac-logo.png" alt="Senac"><b>Salto</b></div><div class="data"><span id="dia"></span><time id="clock"></time></div></header>
<section class="grade"><div class="titulo"><h1>Encontre sua sala</h1><div><nav id="turnos" aria-label="Consultar aulas de hoje por turno"><button data-turno="0">Manhã</button><button data-turno="1">Tarde</button><button data-turno="2">Noite</button></nav><small id="pagina"></small></div></div>
<table><colgroup><col style="width:19%"><col style="width:31%"><col style="width:30%"><col style="width:20%"></colgroup><thead><tr><th>Turma</th><th>Sala</th><th>Docente</th><th>Horário</th></tr></thead><tbody id="aulas"></tbody></table><p id="status" role="status"></p></section>
<div class="midias"><section class="reels"><h2>Vídeos da unidade</h2><div id="reel"></div></section>
<section class="cartao-curso"><h2>Cursos Senac Salto</h2><img id="imagem-curso" alt="" hidden><strong id="curso"></strong><div class="convite" id="convite-curso" hidden><span>Inscreva-se pelo celular</span><div id="qr-curso"></div></div></section></div>
<section id="noticia" aria-label="Notícias da unidade"></section>
<section class="avaliacao" id="avaliacao" hidden><div><small>Google</small><h2>Avalie o Senac Salto</h2></div><div id="qr-avaliacao"></div></section>
<section class="oficinas"><div><small>Saberes em Movimento</small><strong id="oficina"></strong></div><button id="inscrever" hidden>Inscreva-se →</button></section>
<footer><h2>Horários de atendimento</h2><div id="horarios"></div></footer></main>
<dialog id="detalhe"><button class="fechar" type="button">Fechar</button><div id="detalheBody"></div></dialog></body></html>
