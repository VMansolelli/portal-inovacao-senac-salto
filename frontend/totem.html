<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salas de hoje · Senac Salto</title><link rel="stylesheet" href="totem-grade.css"><script defer src="totem-base.js"></script><script defer src="totem-qr.js"></script><script defer src="totem.js"></script></head><body><main>
<header><div class="marca"><img src="senac-logo.png" alt="Senac"><b>Salto</b></div><div class="data"><span id="dia"></span><time id="clock"></time></div></header>
<section class="grade"><div class="titulo"><h1>Encontre sua sala</h1><div><nav id="turnos" aria-label="Consultar aulas de hoje por turno"><button data-turno="0">Manhã</button><button data-turno="1">Tarde</button><button data-turno="2">Noite</button></nav><small id="pagina"></small></div></div>
<table><colgroup><col style="width:19%"><col style="width:31%"><col style="width:30%"><col style="width:20%"></colgroup><thead><tr><th>Turma</th><th>Sala</th><th>Docente</th><th>Horário</th></tr></thead><tbody id="aulas"></tbody></table><p id="status" role="status"></p></section>
<div class="midias"><div id="reel" aria-label="Vídeo da unidade"></div>
<section class="cartao-curso" id="centro" aria-label="Cursos e Reels do Senac Salto"></section>
<div class="quadrados"><section class="oficinas"><nav class="setas" id="oficina-setas" aria-label="Navegação de Oficina" hidden><button type="button" data-passo="-1" aria-label="Oficina anterior">‹</button><button type="button" data-passo="1" aria-label="Oficina seguinte">›</button></nav><img id="oficina-foto" alt="" hidden><div class="oficina-copy"><small>Saberes em Movimento</small><strong id="oficina"></strong><button id="inscrever" hidden>Inscreva-se →</button></div></section>
<section class="avaliacao" id="instagram"><button type="button" id="abrir-instagram" aria-expanded="false" aria-controls="face-instagram"><svg class="icone-instagram" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2.8"/><circle cx="24" cy="8" r="1.7" fill="currentColor"/></svg><strong>Siga o Senac Salto</strong><small>@senacsalto</small><span class="chamada">Ver QR do Instagram →</span></button><div id="face-instagram" hidden><strong>Siga @senacsalto</strong><div id="qr-instagram"></div><small>Aponte a câmera para seguir</small></div></section>
<section class="avaliacao" id="avaliacao"><button type="button" id="abrir-avaliacao" aria-controls="face-qr" aria-expanded="false"><img src="senac-logo.png" alt="Senac"><span class="estrelas" aria-hidden="true">★★★★★</span><strong>Como foi sua experiência?</strong><span class="chamada">Avalie no Google →</span></button><div id="face-qr" hidden><strong>Avalie o Senac Salto</strong><div id="qr-avaliacao"></div><small>Aponte a câmera para avaliar</small></div></section></div></div>
<section id="noticia" aria-label="Notícias da unidade"><div id="noticia-corpo"></div><nav class="setas" id="noticia-setas" aria-label="Navegação de Notícia" hidden><button type="button" data-passo="-1" aria-label="Notícia anterior">‹</button><button type="button" data-passo="1" aria-label="Notícia seguinte">›</button></nav></section>
<footer><h2>Horários de atendimento</h2><div id="horarios"></div></footer></main>
<dialog id="detalhe"><button class="fechar" type="button">Fechar</button><div id="detalheBody"></div></dialog></body></html>
