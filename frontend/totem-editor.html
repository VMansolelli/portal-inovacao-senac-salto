<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar totem · Senac Salto</title><link rel="stylesheet" href="totem.css"><script defer src="totem-base.js"></script><script defer src="totem-editor.js"></script></head><body class="editor"><header><strong>Senac Salto</strong><a href="/?painel">Área restrita</a></header><main><h1>Conteúdo do totem</h1><p id="msg" role="status"></p><div id="painel" hidden>
<section><h2>Horários de atendimento</h2><form id="hora"><label>Secretaria<input name="secretaria" maxlength="254" required></label><label>Biblioteca<input name="biblioteca" maxlength="254" required></label><button>Salvar horários</button></form></section>
<section><h2>Divulgações</h2><form id="edicao"><input type="hidden" name="id"><label>Tipo<select name="tipo"><option>Curso</option><option>Ação</option><option>Vídeo</option></select></label><label>Título<input name="titulo" maxlength="254" required></label><label>Descrição ou legenda do vídeo<textarea name="descricao" maxlength="5000"></textarea></label><div class="periodo"><label>Exibir de<input type="date" name="inicio" required></label><label>Até<input type="date" name="fim" required></label></div><label id="anexo" hidden>Vídeo vertical · MP4 ou WebM, até 48 MB<input type="file" name="video" accept="video/mp4,video/webm"><small id="existente"></small></label><label id="captions" hidden>Legenda sincronizada (opcional, .vtt)<input type="file" name="vtt" accept=".vtt"><small id="vttAtual"></small></label><div><button>Salvar divulgação</button> <button type="reset">Limpar</button></div></form><div id="avisos"></div></section>
<section><h2>Conteúdo do portal</h2><p>Notícias aprovadas aparecem durante um mês. Você pode ocultar um item apenas no totem.</p><div id="itens"></div></section></div></main></body></html>
